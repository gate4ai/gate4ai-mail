connector: email
description: Email over IMAP/SMTP
version: "2"
runtime: wasm
capabilities:
  network:
    - { host: "${setting:imap.host}", port: "${setting:imap.port}", scheme: tls }
    - { host: "${setting:smtp.host}", port: "${setting:smtp.port}", scheme: tls }
    # tls: none хост разрешает только для localhost (локальные мосты, тесты)
    - { host: "${setting:imap.host}", port: "${setting:imap.port}", scheme: tcp }
    - { host: "${setting:smtp.host}", port: "${setting:smtp.port}", scheme: tcp }
  secrets:
    - { alias: "${setting:imap.password}", bind: ["${setting:imap.host}"] }
    - { alias: "${setting:smtp.password}", bind: ["${setting:smtp.host}"] }
    # без smtp.password для SMTP используется пароль IMAP
    - { alias: "${setting:imap.password}", bind: ["${setting:smtp.host}"] }
limits: { memory_mb: 128, timeout_s: 60 }
actions:
  - name: list
    class: read
    untrusted: true
    description: List messages in a folder (newest first)
    args:
      - { name: folder, type: string, default: INBOX }
      - { name: limit, type: integer, default: 20, description: "1..100" }
      - { name: unseen_only, type: boolean }
      - { name: query, type: string, description: full-text search }
    example: gate4ai email list --limit 10
  - name: read
    class: read
    untrusted: true
    description: Read one message (does not mark it as read)
    args:
      - { name: folder, type: string, default: INBOX }
      - { name: uid, type: integer, required: true }
    example: gate4ai email read --uid 42
  - name: draft
    class: write
    verify: drafts_folder
    evidence: eml
    description: Save a draft (not sent)
    args: &addr
      - { name: to, type: "string[]", required: true, format: email, description: recipients }
      - { name: cc, type: "string[]", format: email, description: copy recipients }
      - { name: subject, type: string, required: true }
      - { name: body, type: string, description: plain text body }
      - { name: in_reply_to, type: string, description: Message-ID of the message being answered }
  - name: send
    class: external
    verify: sent_folder
    evidence: eml
    description: Send an email
    args: *addr
